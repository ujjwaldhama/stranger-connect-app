
name: Build STRENZO APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project files
        run: flutter create --platforms=android .

      - name: Set STRENZO App Name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()
          content = re.sub(
              r'android:label="[^"]*"',
              'android:label="STRENZO"',
              content,
              count=1
          )
          path.write_text(content)
          PY

      - name: Add Firebase config
        run: cp google-services.json android/app/google-services.json

      - name: Configure Firebase Gradle plugin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = next((Path(p) for p in [
              "android/settings.gradle.kts",
              "android/settings.gradle"
          ] if Path(p).exists()), None)

          app = next((Path(p) for p in [
              "android/app/build.gradle.kts",
              "android/app/build.gradle"
          ] if Path(p).exists()), None)

          if settings is None or app is None:
              raise SystemExit("Android Gradle files not found")

          settings_line = (
              '    id("com.google.gms.google-services") version "4.6.0" apply false'
              if settings.suffix == ".kts" else
              "    id 'com.google.gms.google-services' version '4.6.0' apply false"
          )

          app_line = (
              '    id("com.google.gms.google-services")'
              if app.suffix == ".kts" else
              "    id 'com.google.gms.google-services'"
          )

          for path, line in [(settings, settings_line), (app, app_line)]:
              content = path.read_text()
              if "com.google.gms.google-services" not in content:
                  content, count = re.subn(
                      r"plugins\s*\{",
                      lambda m: m.group(0) + "\n" + line,
                      content,
                      count=1
                  )
                  if count != 1:
                      raise SystemExit(f"Could not find plugins block in {path}")
                  path.write_text(content)
          PY

      - name: Configure Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks

          keytool -list \
            -keystore android/app/upload-keystore.jks \
            -storetype PKCS12 \
            -storepass:env KEYSTORE_PASSWORD \
            -alias "$KEY_ALIAS"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          def escape(value):
              return (value.replace("\\", "\\\\")
                           .replace("\n", "\\n")
                           .replace("\r", "\\r")
                           .replace(":", "\\:")
                           .replace("=", "\\=")
                           .replace(" ", "\\ "))

          props = (
              f"storePassword={escape(os.environ['KEYSTORE_PASSWORD'])}\n"
              f"keyPassword={escape(os.environ['KEY_PASSWORD'])}\n"
              f"keyAlias={escape(os.environ['KEY_ALIAS'])}\n"
              "storeFile=upload-keystore.jks\n"
          )

          Path("android/key.properties").write_text(props)

          gradle = Path("android/app/build.gradle.kts")

          if not gradle.exists():
              raise SystemExit("Expected build.gradle.kts was not found")

          content = gradle.read_text()

          imports = "import java.util.Properties\nimport java.io.FileInputStream\n\n"

          if "import java.util.Properties" not in content:
              content = imports + content

          declarations = """
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          """

          if "val keystoreProperties =" not in content:
              content, count = re.subn(
                  r"(?m)^android\s*\{",
                  declarations + "android {",
                  content,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Could not find android block")

          signing = """
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                      storeType = "PKCS12"
                  }
              }
          """

          if 'create("release")' not in content:
              content, count = re.subn(
                  r"(?m)^android\s*\{",
                  lambda m: m.group(0) + "\n" + signing,
                  content,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Could not add release signing config")

          content, count = re.subn(
              r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
              'signingConfig = signingConfigs.getByName("release")',
              content
          )

          if count == 0:
              raise SystemExit("Could not find default debug signing line")

          gradle.write_text(content)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate STRENZO App Icon
        run: dart run flutter_launcher_icons

      - name: Verify signing configuration
        run: |
          cd android
          chmod +x gradlew
          ./gradlew signingReport

      - name: Build APK
        run: flutter build apk --release

      - name: Prepare STRENZO APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk stranzo.apk

      - name: Publish STRENZO Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: STRENZO v1.0.0
          body: Official STRENZO Android App
          files: stranzo.apk
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STRENZO-APK
          path: build/app/outputs/flutter-apk/app-release.apk
