
name: Build Stranger Connect APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project files
        run: flutter create --platforms=android .

      - name: Add Firebase config
        run: cp google-services.json android/app/google-services.json

      - name: Configure Firebase Gradle plugin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = next((Path(p) for p in [
              "android/settings.gradle.kts",
              "android/settings.gradle"
          ] if Path(p).exists()), None)

          app = next((Path(p) for p in [
              "android/app/build.gradle.kts",
              "android/app/build.gradle"
          ] if Path(p).exists()), None)

          if settings is None or app is None:
              raise SystemExit("Android Gradle files not found")

          kts = settings.suffix == ".kts"

          settings_line = (
              '    id("com.google.gms.google-services") version "4.6.0" apply false'
              if kts else
              "    id 'com.google.gms.google-services' version '4.6.0' apply false"
          )

          app_line = (
              '    id("com.google.gms.google-services")'
              if app.suffix == ".kts" else
              "    id 'com.google.gms.google-services'"
          )

          for path, line in [(settings, settings_line), (app, app_line)]:
              content = path.read_text()
              if "com.google.gms.google-services" not in content:
                  content, count = re.subn(
                      r"plugins\s*\{",
                      lambda m: m.group(0) + "\n" + line,
                      content,
                      count=1
                  )
                  if count != 1:
                      raise SystemExit(f"Could not find plugins block in {path}")
                  path.write_text(content)
          PY

      - name: Configure Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          def escape(value):
              return (value.replace("\\", "\\\\")
                           .replace("\n", "\\n")
                           .replace("\r", "\\r")
                           .replace(":", "\\:")
                           .replace("=", "\\=")
                           .replace(" ", "\\ "))

          props = (
              f"storePassword={escape(os.environ['KEYSTORE_PASSWORD'])}\n"
              f"keyPassword={escape(os.environ['KEY_PASSWORD'])}\n"
              f"keyAlias={escape(os.environ['KEY_ALIAS'])}\n"
              "storeFile=upload-keystore.jks\n"
          )
          Path("android/key.properties").write_text(props)

          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              raise SystemExit("Expected build.gradle.kts was not found")

          content = gradle.read_text()

          if "val keystoreProperties =" not in content:
              declarations = '''
          val keystoreProperties = java.util.Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(java.io.FileInputStream(keystorePropertiesFile))
          }

          '''
              content, count = re.subn(
                  r"(?m)^android\s*\{",
                  declarations + "android {",
                  content,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Could not find android block")

          signing = '''
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          '''

          if 'create("release")' not in content:
              content = re.sub(
                  r"(?m)^android\s*\{",
                  lambda m: m.group(0) + "\n" + signing,
                  content,
                  count=1
              )

          gradle.write_text(content)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate SHA-1 report
        run: |
          cd android
          chmod +x gradlew
          ./gradlew signingReport

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stranger-Connect-APK
          path: build/app/outputs/flutter-apk/app-release.apk
